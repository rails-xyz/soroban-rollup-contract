{
  "build_script": "../certora_build_rollup_contract.py",
  // Storage access converts a `DataKey` through `Val`, and the prover reads the
  // length of the vector behind that conversion as a symbolic value. No finite
  // `loop_iter` closes such a loop, so assume the loops exit within the bound.
  // No rule reasons about loop behaviour: the withdrawal loop of `rollup` stays
  // unreachable because the rules post empty withdrawal vectors.
  "optimistic_loop": true,
  "rule": [
    "sanity",
    "deposit_rejects_non_positive_amount",
    "rollup_rejects_negative_fees",
    "withdraw_clears_allowance",
    "collect_fees_clears_balance",
    "recover_rejects_non_positive_amount",
    "renounce_ownership_always_rejected",
  ]
}
